name: CI

on:
  push:
    branches: [main]
  pull_request:

# Новый пуш в ту же ветку отменяет предыдущий незавершённый прогон
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (dotnet test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # Интеграционным тестам нужен Docker (Testcontainers) — на ubuntu-latest он уже есть
      - run: dotnet test backend/Messenger.sln -c Release --collect:"XPlat Code Coverage"

  frontend:
    name: Frontend (tsc, vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npm run test:coverage   # vitest + отчёт о покрытии
      - run: npm run build   # tsc --noEmit + vite build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: messenger
          POSTGRES_USER: messenger
          POSTGRES_PASSWORD: messenger_dev_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U messenger -d messenger"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            Frontend/playwright-report
            Frontend/test-results

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t messenger:ci .
